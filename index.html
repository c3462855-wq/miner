<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-AI Miner</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="home" class="page">
        <div class="user-profile">
            <img src="assets/avatars/level1.png" id="avatar" alt="Avatar" style="width: 50px; border-radius: 50%;">
            <span id="username">Adam</span>
        </div>
        
        <div class="mining-section" style="text-align: center; margin-top: 50px;">
            <h1 id="balance">0.0000</h1>
            <button id="mineBtn" style="padding: 15px 30px; border-radius: 20px; background: gold;">ابدأ التعدين ⛏️</button>
        </div>
    </div>

    <div id="leaderboard" class="page" style="display:none;"> 🏆 صفحة الترتيب </div>
    <div id="shop" class="page" style="display:none;"> 🛒 المتجر </div>
    <div id="referral" class="page" style="display:none;"> 👥 الإحالة </div>
    <div id="wallet" class="page" style="display:none;"> 💰 المحفظة </div>

    <nav class="navbar">
        <div class="nav-item active">🏠<br>الرئيسية</div>
        <div class="nav-item">📈<br>الترتيب</div>
        <div class="nav-item">🛒<br>المتجر</div>
        <div class="nav-item">👥<br>الإحالة</div>
        <div class="nav-item">💰<br>المحفظة</div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
